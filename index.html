<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grupp 3</title>
    <style>
      body {
        background-color: #f9a6de;
        font-family: Arial, sans-serif;
        margin: 0px;
        padding: 40px;
      }

      h1 {
        text-align: center;
        color: white;
        font-size: 40px;
      }

      .container {
        width: 65%;
        margin: 40px auto;
        background-color: white;
        padding: 40px;
        border-radius: 15px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
      }

      .input-container {
        display: grid;
        grid-template-columns: 1fr 2fr;
        align-items: center;
        margin-bottom: 15px;
      }

      label {
        font-size: 20px;
        color: black;
      }

      .textfield {
        width: 100%;
        padding: 10px;
        font-size: 16px;
        border: 2px solid #ccc;
        border-radius: 8px;
        font-size: 16px;
      }

      .checkbox {
        width: 20px;
        height: 20px;
        accent-color: #ed96d3;
      }

      button {
        display: block;
        margin-top: 10px;
        padding: 12px 35px;
        background-color: #ed96d3;
        color: white;
        border: 2px solid #ccc;
        border-radius: 8px;
        font-size: 18px;
        cursor: pointer;
      }

      button:hover {
        background-color: #e5739f;
      }

      #Div {
        margin-top: 25px;
        border-radius: 5px;
        width: 100%;
        height: 70px;
        border: 2px solid #ccc;
        box-sizing: border-box;
      }
    </style>
  </head>

  <body>
    <h1>Labb 2 - Grupp 3</h1>

    <div class="container">
      <div class="input-container">
        <label for="color">Färg:</label>
        <input type="text" id="color" name="color" class="textfield" />
      </div>

      <div class="input-container">
        <label for="content">Innehåll:</label>
        <input type="text" id="content" name="content" class="textfield" />
      </div>

      <div class="input-container">
        <label for="divstyle">Stil på boxen:</label>
        <input type="checkbox" id="divstyle" name="divstyle" class="checkbox" />
      </div>

      <button id="button">Ta Bort</button>

      <div id="Div"></div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
